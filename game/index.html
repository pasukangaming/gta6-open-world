<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solara Bay — an original top-down open-world crime game. Explore a coastal city on foot and by car, steal cars, outrun the police, and finish five story missions.">
<meta name="theme-color" content="#0a1428">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a1428'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='%23ffd23f'%3ES%3C/text%3E%3C/svg%3E">
<title>Solara Bay — Open-World Crime Game</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a1428; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
  #wrap { width: 1280px; max-width: 100vw; }
  canvas { display: block; width: 100%; height: auto; background: #4a8a4a; }
  #help { color: #c8d0e0; font-size: 14px; text-align: center; padding: 10px 8px; line-height: 1.6; }
  #help b { color: #ffd23f; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="help">
    <b>WASD</b> move &nbsp;·&nbsp; <b>Shift</b> run &nbsp;·&nbsp; <b>E</b> steal a car &nbsp;·&nbsp; <b>W/S</b> drive &nbsp;·&nbsp; <b>Mouse</b> aim &nbsp;·&nbsp; <b>Click</b> shoot &nbsp;·&nbsp; <b>P</b> pause &nbsp;·&nbsp; <b>M</b> mute
  </div>
  <noscript><p style="color:#fff;text-align:center">Solara Bay needs JavaScript to play.</p></noscript>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
